apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wp-ingress
  namespace: ns-projet
  annotations:
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: "cert-manager-webhook-duckdns-production"
spec:
  ingressClassName: traefik
  tls:
  - hosts: [miwp.duckdns.org]
    secretName: wordpress-tls
  rules:
  - host: miwp.duckdns.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wordpress-svc
            port:
              number: 80

